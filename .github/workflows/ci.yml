name: Molecule-AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint & Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile app/main.py app/config.py app/ml/train_model.py

      - name: Verify model files exist
        run: |
          echo "Checking pretrained model files..."
          test -f app/ml/pretrained/activity_bbbp_model.joblib || exit 1
          test -f app/ml/pretrained/toxicity_tox21_model.joblib || exit 1
          test -f app/ml/pretrained/solubility_esol_model.joblib || exit 1
          test -f app/ml/pretrained/activity_bace_model.joblib || exit 1
          test -f app/ml/pretrained/training_report.json || exit 1
          echo "All model files present."

      - name: Verify training report
        run: |
          python -c "
          import json
          with open('app/ml/pretrained/training_report.json') as f:
              report = json.load(f)
          assert report['n_models_trained'] == 4, 'Expected 4 models'
          assert report['n_errors'] == 0, 'Training had errors'
          print(f'Training report OK: {report[\"n_models_trained\"]} models, {report[\"n_errors\"]} errors')
          "

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: https://moleculeai-api.onrender.com

      - name: Verify build output
        run: |
          test -d dist || exit 1
          test -f dist/index.html || exit 1
          echo "Frontend build successful."
